# cargo-deny policy, checked by `mise run deny`.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[advisories]
# Vulnerabilities in any crate fail the check; "unmaintained" notices only
# fail for direct dependencies, the ones Colonnade can actually replace.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Licenses compatible with distributing Colonnade binaries under MIT.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
# GPUI's dependency tree legitimately carries several major versions of
# crates such as `windows`; duplicates are reported by `cargo tree -d` instead.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
