name: colonnade-test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: colonnade
      POSTGRES_PASSWORD: colonnade
      POSTGRES_DB: colonnade
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colonnade -d colonnade"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: colonnade
      MYSQL_DATABASE: colonnade
      MYSQL_USER: colonnade
      MYSQL_PASSWORD: colonnade
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucolonnade", "-pcolonnade"]
      retries: 60

  mariadb:
    image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    environment:
      MARIADB_ROOT_PASSWORD: colonnade
      MARIADB_DATABASE: colonnade
      MARIADB_USER: colonnade
      MARIADB_PASSWORD: colonnade
    ports:
      - "127.0.0.1:53307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      retries: 60
