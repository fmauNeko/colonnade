name: Development push and PR

on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are a local development aid; skip the postinstall hook in CI.
  MISE_NO_HOOKS: "1"
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      # Install and enable only the tools this job needs (mise run would
      # otherwise auto-install every tool in mise.toml).
      MISE_ENABLE_TOOLS: cocogitto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          cache_key_prefix: mise-v1-${{ github.job }}

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: mise run lint:commits "${BASE_SHA}..${HEAD_SHA}"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22

      - name: Install Linux build dependencies
        run: mise run deps:linux

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: [lint]
    env:
      MISE_ENABLE_TOOLS: rust,github:taiki-e/cargo-llvm-cov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          cache_key_prefix: mise-v1-${{ github.job }}

      - name: Install Linux build dependencies
        run: mise run deps:linux

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run unit tests with coverage
        run: mise run test:cov

  db-tests:
    name: Database tests
    runs-on: ubuntu-24.04
    needs: [lint]
    env:
      MISE_ENABLE_TOOLS: rust
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_USER: colonnade
          POSTGRES_PASSWORD: colonnade
          POSTGRES_DB: colonnade
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U colonnade -d colonnade"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:26.10@sha256:7b16ec7caa94ca7e92f4c5ec287de69d2e8738db056ceb629022951a6f6d910b
        env:
          MYSQL_ROOT_PASSWORD: colonnade
          MYSQL_DATABASE: colonnade
          MYSQL_USER: colonnade
          MYSQL_PASSWORD: colonnade
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ucolonnade -pcolonnade"
          --health-interval 2s --health-timeout 3s --health-retries 60
      mariadb:
        image: mariadb:13.0@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
        env:
          MARIADB_ROOT_PASSWORD: colonnade
          MARIADB_DATABASE: colonnade
          MARIADB_USER: colonnade
          MARIADB_PASSWORD: colonnade
        ports:
          - 53307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-timeout 3s --health-retries 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          cache_key_prefix: mise-v1-${{ github.job }}

      - name: Install Linux build dependencies
        run: mise run deps:linux

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run database driver tests
        run: mise run test:db

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint]
    env:
      MISE_ENABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          cache_key_prefix: mise-v1-${{ github.job }}

      - name: Install Linux build dependencies
        run: mise run deps:linux

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: mise run build
