[package]
name = "colonnade"
version = "0.0.0"
edition = "2024"
description = "A cross-platform database manager for many DBMS"
license = "MIT"
authors = ["Florian Maunier"]
repository = "https://github.com/fmauNeko/colonnade"
readme = "README.md"
publish = false

[dependencies]
gpui-kit = { version = "0.7.3", features = ["tree-sitter-sql"] }
futures = "0.3"
keyring = "4.2.0"
notify = "8.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "sqlite-bundled"] }
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support", "tree-sitter-sql"] }
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "warn"
