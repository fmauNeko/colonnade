#:schema https://mise.jdx.dev/schema/mise.json
min_version = "2026.10.0"

[tools]
rust = { version = "1.99.1", profile = "minimal", components = ["rustfmt", "clippy", "llvm-tools"] }
cocogitto = "7.0.0"
typos = "1.51.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
cargo-deny = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"

[hooks]
postinstall = { task = "hooks" }

[tasks.hooks]
description = "Install the git hooks declared in cog.toml (commit-msg: Conventional Commits)"
run = "cog install-hook --all --overwrite"

[tasks."lint:commits"]
description = "Check that every commit in a git range follows Conventional Commits"
usage = 'arg "[range]" help="git revision range to check" default="origin/develop..HEAD"'
run = 'cog check "${usage_range}"'

[tasks."deps:linux"]
description = "Install the system libraries GPUI needs to build on Debian/Ubuntu"
run = """
sudo apt-get update
sudo apt-get install --no-install-recommends -y \
  build-essential pkg-config \
  libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libwayland-dev \
  libfreetype6-dev libfontconfig1-dev libasound2-dev libssl-dev libzstd-dev
"""

[tasks.run]
description = "Run Colonnade (debug build)"
run = "cargo run"

[tasks.build]
description = "Build Colonnade (debug)"
run = "cargo build --locked"

[tasks."build:release"]
description = "Build Colonnade (release)"
run = "cargo build --locked --release"

[tasks.package]
description = "Package the release build into dist/ (archive + SHA-256), see script/package.sh"
shell = "bash -c"
run = "bash script/package.sh"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint Rust sources with Clippy (warnings are errors)"
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks.test]
description = "Run the test suite"
run = "cargo test --locked"

[tasks."test:cov"]
description = "Run the test suite with a coverage summary (cargo-llvm-cov)"
run = "cargo llvm-cov --locked"

[tasks.deny]
description = "Audit dependencies: advisories, licenses, bans and sources (deny.toml)"
run = "cargo deny --locked check"

[tasks.typos]
description = "Check spelling in sources and docs"
run = "typos"

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows with actionlint and zizmor (online audits need GH_TOKEN)"
run = ["actionlint", "zizmor .github/workflows"]

[tasks.lint]
description = "Run every static check"
depends = ["fmt:check", "clippy", "typos", "lint:workflows", "deny"]

[tasks.ci]
description = "Run the same checks as the develop CI workflow"
depends = ["lint", "test:cov", "build"]
